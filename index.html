<head>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), 
                        url('https://assets.ticketsberry.com/events/52d44f0f-0229-4253-9581-2b3773f48318/e6cc99f2-3df7-4a27-abfe-f760f96f2930/music-awards-verona-tickets.webp') no-repeat center center;
            background-size: cover;
            background-attachment: scroll;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 10px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Top Ad Section */
        .ad-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60px;
        }

        /* Event Name */
        .event-title {
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
            color: #f8fafc;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Thumbnail & Video Player Container (16:9 Aspect Ratio) */
        .thumbnail-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Glowing Play Button */
        .play-btn-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(255, 0, 0, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.8), 0 0 50px rgba(255, 0, 0, 0.5);
            animation: glowing 1.5s infinite alternate;
            transition: transform 0.2s ease;
            z-index: 5;
        }

        .play-btn-glow::after {
            content: "";
            position: absolute;
            left: 32px;
            width: 0;
            height: 0;
            border-top: 16px solid transparent;
            border-bottom: 16px solid transparent;
            border-left: 26px solid #ffffff;
        }

        .thumbnail-container:hover .play-btn-glow {
            transform: translate(-50%, -50%) scale(1.1);
        }

        @keyframes glowing {
            0% {
                box-shadow: 0 0 15px rgba(255, 0, 0, 0.6), 0 0 30px rgba(255, 0, 0, 0.4);
            }
            100% {
                box-shadow: 0 0 30px rgba(255, 0, 0, 1), 0 0 60px rgba(255, 0, 0, 0.8);
            }
        }

        /* Fake Video Player Control Bar */
        .video-controls-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 6;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-icon {
            width: 16px;
            height: 16px;
            fill: #fff;
            cursor: pointer;
        }

        .time-display {
            font-size: 12px;
            color: #ffffff;
            font-family: monospace;
            letter-spacing: 0.5px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ff0000;
            border-radius: 50%;
            animation: livePulse 1s infinite alternate;
        }

        @keyframes livePulse {
            0% { opacity: 0.3; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        /* Buffering / Loading Overlay */
        .buffering-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .buffering-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid #ff0000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .buffering-text {
            font-size: 14px;
            color: #cbd5e1;
            letter-spacing: 1px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Footer / Bottom spacing */
        .footer-note {
            font-size: 11px;
            color: #64748b;
            text-align: center;
            margin-top: 10px;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .event-title {
                font-size: 20px;
            }
            .play-btn-glow {
                width: 60px;
                height: 60px;
            }
            .play-btn-glow::after {
                left: 24px;
                border-top: 12px solid transparent;
                border-bottom: 12px solid transparent;
                border-left: 20px solid #ffffff;
            }
        }
    </style>
</head>
